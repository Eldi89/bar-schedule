/* ---------- read-only staff page (opened from a shared link) ---------- */
let STAFF = null;
function renderStaff() {
  const D = STAFF;
  FMT = D.f || '12';
  const ws = D.w;
  const days = weekDates(ws);
  const people = D.p.map(([name, color, role], i) => ({ i, name, color, role }));
  const types = D.t.map(([name, color]) => ({ name, color }));
  const sh = D.s.map(([pi, off, start, end, ti, role, note], i) => ({ id: `s${i}`, p: people[pi], date: addDays(ws, off), start, end, t: types[ti] || null, role, note }))
    .filter(s => s.p).sort((a, b) => shiftSpan(a)[0] - shiftSpan(b)[0]);
  const me = store.get(ME_KEY) || '';
  const mine = sh.filter(s => s.p.name === me);
  const hrs = mine.reduce((a, s) => a + shiftMins(s), 0) / 60;
  const tn = s => s.t ? s.t.name : 'Shift';
  const tc = s => s.t ? s.t.color : '#6B7A8C';
  const coworkers = s => {
    const [a, b] = shiftSpan(s);
    return sh.filter(x => x !== s && x.p.name !== me && (() => { const [c, d] = shiftSpan(x); return c < b && d > a; })()).map(x => firstName(x.p.name));
  };
  const myList = mine.map(s => `<article class="my-shift" style="--c:${tc(s)}">
      <div class="ms-day"><span>${DOW[weekday(s.date)]}</span><b class="num">${+s.date.slice(8)}</b></div>
      <div class="ms-main"><b>${esc(tn(s))}${s.role !== D.m ? ` · ${esc(s.role)}` : ''}</b><span class="num">${fmtRange(s.start, s.end, true)} · ${fmtH(shiftMins(s) / 60)}h</span>
      ${coworkers(s).length ? `<small>With ${esc([...new Set(coworkers(s))].join(', '))}</small>` : ''}${s.note ? `<small class="ms-note">${esc(s.note)}</small>` : ''}
      ${mealRule(s).total ? `<small class="muted">${esc(mealRule(s).text)}</small>` : ''}</div></article>`).join('');
  const full = days.map(d => {
    const list = sh.filter(s => s.date === d);
    return `<section class="sv-day"><h3><span>${DOWL[weekday(d)]}</span><small class="num">${MON[+d.slice(5, 7) - 1]} ${+d.slice(8)}</small></h3>
      ${list.length ? list.map(s => `<div class="sv-row${s.p.name === me ? ' me' : ''}"><span class="swatch" style="--c:${tc(s)}"></span><span class="sv-t"><b>${esc(tn(s))}</b> <span class="num muted">${fmtRange(s.start, s.end)}</span></span><span class="sv-n">${esc(s.p.name)}${s.role !== D.m ? `<small class="muted">${esc(s.role)}</small>` : ''}</span></div>`).join('') : '<p class="muted small">No shifts</p>'}</section>`;
  }).join('');
  $('#app').innerHTML = `<div class="staff">
    <header class="sv-head"><span class="brand-name">${esc(D.b)}</span><span class="sv-week num">${fmtWeekRange(ws, true)}</span><small class="muted">Updated ${fmtStamp(D.u)}</small></header>
    <label class="field"><span>Who are you?</span><select class="inp" id="me-sel" data-chg="me"><option value="">Pick your name</option>${people.map(p => `<option${p.name === me ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    ${me ? `<section class="sv-mine"><div class="sv-mine-h"><h2>Your shifts</h2><span class="num">${mine.length} shift${mine.length === 1 ? '' : 's'} · ${fmtH(hrs)}h</span></div>
      ${mine.length ? myList + `<button class="btn btn-accent btn-block" data-act="staff-ics">${ICON.cal}Add to my calendar</button>` : '<p class="muted">You are not on the schedule this week.</p>'}</section>` : ''}
    <h2 class="sv-all">Whole team</h2>${full}
    <p class="muted small sv-foot">Read-only copy of the schedule. If something looks wrong, ask your manager for a new link.</p>
  </div>`;
  STAFF_CTX = { D, mine, tn };
}

/* ============================================================
   Behind the Bar · app shell: state of the screen, actions, boot
   ============================================================ */
let STAFF_MODE = false;
let CUR_A = null;
const U = { tab: 'schedule', mode: 'day', week: '', day: todayStr(), sheet: null, hideDemo: false };

/* ---------- undo + commit ---------- */
const undoStack = [];
function commit(fn, msg, opts) {
  undoStack.push(JSON.stringify(S));
  if (undoStack.length > 40) undoStack.shift();
  fn();
  save();
  render();
  if (msg) toast(msg, !(opts && opts.noUndo));
}
function undo() {
  const prev = undoStack.pop();
  if (!prev) { toast('Nothing to undo'); return; }
  S = migrate(JSON.parse(prev));
  save();
  if (U.sheet && !['issues', 'cost', 'gaps', 'share', 'weekmenu'].includes(U.sheet.kind)) U.sheet = null;
  render();
  renderSheet();
  toast('Undone');
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, withUndo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? `<button data-act="undo">${ICON.undo}Undo</button>` : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, withUndo ? 5200 : 2600);
}

/* ---------- render ---------- */
function render() {
  if (STAFF_MODE) { renderStaff(); return; }
  FMT = S.settings.timeFormat;
  const A = analyze(U.week);
  CUR_A = A;
  const active = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const gx = $('#grid-wrap') ? $('#grid-wrap').scrollLeft : 0;
  const nx = $('#needs-wrap') ? $('#needs-wrap').scrollLeft : 0;
  const main = U.tab === 'schedule' ? vSchedule(A) : U.tab === 'team' ? vTeam(A) : vSetup();
  $('#app').innerHTML = `${vHeader()}<main id="main" class="tab-${U.tab}">${main}</main>${vTabs('tabs-bottom')}`;
  if ($('#grid-wrap')) $('#grid-wrap').scrollLeft = gx;
  if ($('#needs-wrap')) $('#needs-wrap').scrollLeft = nx;
  window.scrollTo(0, y);
  if (active && !$('#sheet-root').contains(document.getElementById(active))) { const el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
  document.title = `${S.settings.barName} · Schedule`;
  if (U.sheet && LIVE.has(U.sheet.kind)) renderSheet();
}
const LIVE = new Set(['issues', 'cost', 'gaps', 'weekmenu', 'share', 'pick', 'cell']);
const SHEETS = { pick: shPick, cell: shCell, shift: shShift, person: shPerson, type: shType, autofill: shAutofill, weekmenu: shWeekMenu, issues: shIssues, gaps: shGaps, cost: shCost, share: shShare, confirm: shConfirm };
let lastFocus = null;
function openSheet(kind, data) {
  if (!U.sheet) lastFocus = document.activeElement;
  U.sheet = Object.assign({ kind }, data || {});
  renderSheet(true);
  if (kind === 'share') prepareShare();
}
function closeSheet() {
  U.sheet = null;
  renderSheet();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function renderSheet(fresh) {
  const root = $('#sheet-root');
  if (!U.sheet) { root.innerHTML = ''; document.documentElement.classList.remove('locked'); return; }
  const bodyEl = $('#sheet-body');
  const sy = bodyEl && !fresh ? bodyEl.scrollTop : 0;
  const active = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;
  const openDetails = [...root.querySelectorAll('details[open]')].map(d => d.className);
  root.innerHTML = `<div class="scrim${fresh ? ' anim' : ''}" data-act="scrim"><div class="sheet sheet-${U.sheet.kind}" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${SHEETS[U.sheet.kind]()}</div></div>`;
  document.documentElement.classList.add('locked');
  openDetails.forEach(c => { const d = root.querySelector(`details.${c.split(' ')[0]}`); if (d) d.open = true; });
  const nb = $('#sheet-body');
  if (nb) nb.scrollTop = sy;
  if (active && document.getElementById(active)) document.getElementById(active).focus({ preventScroll: true });
  else if (fresh) { const f = root.querySelector('.sheet-head .icon-btn'); if (f) f.focus({ preventScroll: true }); }
}

/* ---------- helpers for actions ---------- */
function setWeek(ws) {
  const off = (dnum(U.day) - dnum(U.week) + 7) % 7;
  U.week = ws;
  U.day = addDays(ws, clamp(off, 0, 6));
  render();
}
function defaultRoleFor(typeId, d) {
  const cov = coverageFor(d, shiftsBetween(d, d));
  const r = cov.rows.find(x => x.n.typeId === typeId && x.missing > 0);
  return r ? r.n.role : S.settings.roles[0];
}
function draftFromShift(s) { return clone(s); }
function newShiftDraft(d, staffId, role) {
  const t = S.types[0];
  return { id: uid(), staffId: staffId || '', date: d, start: t ? t.start : '18:00', end: t ? t.end : '02:00', typeId: t ? t.id : null, role: role || S.settings.roles[0], note: '', auto: false };
}
function goDay(d) {
  U.tab = 'schedule'; U.mode = 'day';
  const ws = weekStartOf(d, S.settings.weekStart);
  U.week = ws; U.day = d;
  U.sheet = null; renderSheet();
  render();

}

/* ---------- change / input handlers ---------- */
const CHG = {

    const k = el.dataset.k;

    if (el.dataset.num) { v = parseFloat(v); if (!isFinite(v)) { render(); return; } }
    if (k === 'barName') v = String(v).trim() || 'My Bar';
    commit(() => {

      if (k === 'weekStart') { U.week = weekStartOf(U.day, v); }
    });
  },
  'need': el => {
    const n = S.needs.find(x => x.id === el.dataset.id); if (!n) return;
    const v = clamp(parseInt(el.value, 10) || 0, 0, 20);
    commit(() => { n.counts[+el.dataset.wd] = v; });
  },
  'forecast': el => { const v = parseFloat(el.value); commit(() => { S.weeks[U.week] = Object.assign({}, S.weeks[U.week], { forecast: isFinite(v) && v > 0 ? v : 0 }); }); renderSheet(); },
  'restore': el => {
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let data = null;
      try { data = migrate(JSON.parse(r.result)); } catch (e) { data = null; }
      if (!data || !Array.isArray(data.staff) || !Array.isArray(data.shifts)) { toast('That file is not a Behind the Bar backup'); return; }
      confirmSheet({ title: 'Restore this backup?', text: `${data.staff.length} people and ${data.shifts.length} shifts from “${esc(data.settings.barName)}”. What is on this device now will be replaced.`, ok: 'Restore', danger: true, onOk: () => { closeSheet(); commit(() => { S = data; }, 'Backup restored'); U.week = weekStartOf(todayStr(), S.settings.weekStart); render(); } });
    };
    r.readAsText(f);
    el.value = '';
  },
  'pk-time': el => { U.sheet[el.dataset.k] = el.value || U.sheet[el.dataset.k]; renderSheet(); },
  'sd': el => {
    const dr = U.sheet.draft; const k = el.dataset.k;

const INP = {
  'pe': el => { const dr = U.sheet.draft; dr[el.dataset.k] = el.dataset.num ? el.value : el.value; },

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === 'scrim' && e.target !== el) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && U.sheet) { e.preventDefault(); closeSheet(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing && !STAFF_MODE) { e.preventDefault(); undo(); }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'role-new') { e.preventDefault(); ACT['role-add'](); }
});
window.addEventListener('storage', e => { if (e.key === KEY && !STAFF_MODE && !U.sheet) { const s = load(); if (s) { S = s; render(); } } });

async function boot() {
  const h = location.hash || '';
  if (h.startsWith('#v=')) {
    try { STAFF = JSON.parse(await unpackString(h.slice(3))); STAFF_MODE = !!(STAFF && STAFF.w && Array.isArray(STAFF.s)); } catch (e) { STAFF_MODE = false; }
    if (STAFF_MODE) { document.documentElement.classList.add('staff-mode'); document.title = `${STAFF.b} · Your shifts`; renderStaff(); return; }
  }
  STAFF_MODE = false;
  document.documentElement.classList.remove('staff-mode');
  S = load();
  if (!S) { S = makeDemo(); autoFill(weekStartOf(todayStr(), S.settings.weekStart)); save(); }
  FMT = S.settings.timeFormat;
  U.week = weekStartOf(U.day, S.settings.weekStart);
  try { U.mode = matchMedia('(min-width: 900px)').matches ? 'week' : 'day'; } catch (e) { U.mode = 'day'; }
  render();
}
window.addEventListener('hashchange', () => { if ((location.hash || '').startsWith('#v=') || STAFF_MODE) boot(); });
boot();

})();
