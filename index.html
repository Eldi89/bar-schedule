<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Behind the Bar</title>
<meta name="description" content="Build, check and share bartender schedules for a New York bar.">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bar Schedule">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: sticky header (bar name, sections, week switcher) over a working board.
   Phones get a bottom tab bar and a day-by-day builder; desktops get a top nav, the week grid,
   and a right rail with checks and labor cost. Sheets slide up on phones, center on desktop. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --sunken:#E2E5EA;
  --ink:#15181D; --muted:#59616C; --faint:#8A919B; --line:#D5D9DF; --line-2:#E6E9ED;
  --accent:#0C6B66; --accent-ink:#FFFFFF; --accent-soft:#D6ECEA; --accent-line:#8FC7C1;
  --ok:#1C7442; --ok-soft:#DCF0E3; --warn:#985500; --warn-soft:#FAEAD0; --bad:#B3261E; --bad-soft:#FADFDB;
  --info:#38568F; --info-soft:#E1E8F5; --money:#7D5F0C; --money-soft:#F4EBCB;
  --mix:15%;
  --shadow:0 1px 2px rgb(21 24 29 / .06), 0 12px 32px rgb(21 24 29 / .12);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-sm:8px; --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1114; --surface:#171B20; --surface-2:#1E2329; --sunken:#0A0C0F;
    --ink:#E8EBEE; --muted:#A2AAB4; --faint:#6D7681; --line:#2C323A; --line-2:#232930;
    --accent:#45C4B7; --accent-ink:#04201E; --accent-soft:#12302D; --accent-line:#236059;
    --ok:#5DCB8F; --ok-soft:#11291C; --warn:#F1B454; --warn-soft:#33250E; --bad:#FF857A; --bad-soft:#3A1815;
    --info:#95B3EF; --info-soft:#18233A; --money:#E4C45F; --money-soft:#2D260F;
    --mix:26%; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#171B20; --surface-2:#1E2329; --sunken:#0A0C0F;
  --ink:#E8EBEE; --muted:#A2AAB4; --faint:#6D7681; --line:#2C323A; --line-2:#232930;
  --accent:#45C4B7; --accent-ink:#04201E; --accent-soft:#12302D; --accent-line:#236059;
  --ok:#5DCB8F; --ok-soft:#11291C; --warn:#F1B454; --warn-soft:#33250E; --bad:#FF857A; --bad-soft:#3A1815;
  --info:#95B3EF; --info-soft:#18233A; --money:#E4C45F; --money-soft:#2D260F;
  --mix:26%; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;flex:none}
.muted{color:var(--muted)} .small{font-size:13px} .grow{flex:1}
.warn{color:var(--warn)}
.lbl{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl.sect{margin-top:6px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.hint{display:flex;gap:6px;align-items:flex-start;font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.hint .i{width:16px;height:16px;margin-top:1px}
.hint-money{color:var(--money)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-ui);font-weight:600;font-size:15.5px;letter-spacing:.01em;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-accent:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink));border-color:transparent}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-danger-solid{background:var(--bad);color:#fff;border-color:transparent}
.btn-sm{height:34px;padding:0 11px;font-size:14.5px}
.btn-block{width:100%}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn .i{width:20px;height:20px}
.icon-sm{width:32px;height:32px}
.icon-sm .i{width:16px;height:16px}
.linkbtn{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-ui);font-weight:600;color:var(--accent);padding:4px 0}
.linkbtn .i{width:16px;height:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.inline{display:flex;gap:8px;align-items:center}
.inline .inp{flex:1}
.filebtn{cursor:pointer}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 16px 8px;display:grid;gap:6px}
.top-row{display:flex;align-items:center;gap:12px;min-width:0}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1;letter-spacing:.015em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.week-row{display:flex;align-items:center;gap:6px}
.week-row .icon-btn{width:36px;height:36px}
.week-label{display:flex;flex-direction:column;align-items:flex-start;padding:0 6px;border-radius:8px;min-width:0}
.week-label span{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;white-space:nowrap}
.week-label small{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;font-family:var(--f-ui);font-size:13px;font-weight:600;white-space:nowrap}
.status .i{width:15px;height:15px}
.s-draft{background:var(--sunken);color:var(--muted)}
.s-sent{background:var(--ok-soft);color:var(--ok)}
.s-changed{background:var(--warn-soft);color:var(--warn)}

/* tabs: bottom bar on phones, segmented nav in the header on desktop */
.tabs{display:flex}
.tab{display:flex;align-items:center;gap:6px;font-family:var(--f-ui);font-weight:600;color:var(--muted)}
.tabs-bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-bottom .tab{height:var(--tab-h);flex-direction:column;justify-content:center;gap:3px;font-size:12px;letter-spacing:.04em}
.tabs-bottom .tab .i{width:22px;height:22px}
.tabs-bottom .tab[aria-selected="true"]{color:var(--accent)}
.tabs-top{gap:3px;background:var(--sunken);border-radius:12px;padding:3px}
.tabs-top .tab{height:34px;padding:0 14px;border-radius:9px;font-size:14.5px}
.tabs-top .tab .i{width:17px;height:17px}
.tabs-top .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
@media (max-width:899px){.tabs-top{display:none}}
@media (min-width:900px){.tabs-bottom{display:none}}
@media (max-width:420px){.top-row .btn-accent span{display:none}.top-row .btn-accent{width:40px;padding:0}}

main{max-width:1440px;margin:0 auto;padding:14px 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 32px)}
@media (min-width:900px){main{padding-bottom:48px}}

/* ---------- schedule toolbar + stats ---------- */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
@media (max-width:480px){.toolbar .seg button .i{display:none}.toolbar .seg button{padding:0 12px}.toolbar>.btn{padding:0 11px}}
.seg{display:inline-flex;background:var(--sunken);border-radius:11px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;font-family:var(--f-ui);font-weight:600;color:var(--muted)}
.seg button .i{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg-sm button{height:30px;padding:0 10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-2);min-width:0}
.stat:hover{border-color:var(--line)}
.stat-k{font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.stat-v small{font-size:17px;color:var(--muted);font-weight:700}
.stat-ok{color:var(--ok);display:inline-flex}
.stat.sev-bad{background:var(--bad-soft);border-color:transparent}.stat.sev-bad .stat-v{color:var(--bad)}
.stat.sev-warn{background:var(--warn-soft);border-color:transparent}.stat.sev-warn .stat-v{color:var(--warn)}
@media (max-width:440px){.stat{padding:8px 9px}.stat-v{font-size:21px}.stat-v small{font-size:14px}.stat-k{font-size:10.5px;letter-spacing:.05em}}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:var(--r);background:var(--info-soft);margin-bottom:14px}
.banner>.i{color:var(--info)}
.banner-t{flex:1;min-width:200px}
.banner-a{display:flex;gap:8px}

.sched{display:grid;gap:16px}
.sched-main{min-width:0}
.rail{display:none}
@media (min-width:1200px){.sched{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.rail{display:grid;gap:12px;position:sticky;top:132px}}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px}
.panel h3{font-family:var(--f-ui);font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* ---------- day builder ---------- */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.daypill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);position:relative;min-width:0}
.dp-dow{font-family:var(--f-ui);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dp-num{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1}
.dp-cov{font-family:var(--f-ui);font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:99px;line-height:1.5}
.cov-full{background:var(--ok-soft);color:var(--ok)}
.cov-short{background:var(--warn-soft);color:var(--warn)}
.cov-none{color:var(--faint)}
.daypill.today::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.daypill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daypill.on .dp-dow{color:inherit;opacity:.75}
.daypill.on .cov-none{color:inherit;opacity:.6}
@media (max-width:380px){.dp-num{font-size:21px}.dp-cov{font-size:10.5px;padding:1px 4px}}

.day-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.day-title{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.day-sub{font-family:var(--f-ui);color:var(--muted);margin-top:4px}

.duty{margin:0 0 14px;padding:12px 14px 10px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r)}
.duty figcaption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.duty-key{display:inline-flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-weight:500}
.duty-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.k-a,.b-a{background:var(--accent)} .k-b,.b-b{background:var(--accent-line)}
.duty-cols{display:flex;gap:3px;align-items:flex-end}
.duty-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.duty-bar{height:58px;display:flex;flex-direction:column-reverse;justify-content:flex-start;position:relative;border-bottom:1px solid var(--line)}
.duty-bar i{display:block;width:100%}
.duty-bar i.b-a{border-radius:0}
.duty-bar i:last-child{border-radius:3px 3px 0 0}
.duty-n{position:absolute;left:0;right:0;top:-2px;text-align:center;font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--muted);transform:translateY(-100%)}
.duty-bar{margin-top:14px}
.duty-h{font-family:var(--f-ui);font-size:11px;color:var(--muted);text-align:left;white-space:nowrap;height:14px}

.slots{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.slot{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);min-width:0}
.slot-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line-2)}
.slot-title{flex:1;min-width:0;display:flex;flex-direction:column}
.slot-title b{font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.1}
.slot-title span{font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:99px;font-family:var(--f-ui);font-weight:700;font-size:13px;white-space:nowrap}
.pill.cov-none{background:var(--sunken);color:var(--muted)}
.slot-body{display:grid;gap:12px;padding:12px 14px 12px}
.role-row{display:grid;gap:6px}
.role-label{font-family:var(--f-ui);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.role-label .muted{text-transform:none;letter-spacing:0;font-weight:500}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 11px 0 4px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600;max-width:100%;position:relative}
.pchip:hover{border-color:var(--line)}
.pchip.static{cursor:default;height:34px}
.pc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-time{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);font-weight:500}
.pc-note{font-weight:800;color:var(--accent)}
.add-slot{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 13px 0 9px;border-radius:99px;border:1.5px dashed var(--accent-line);color:var(--accent);font-family:var(--f-ui);font-weight:600}
.add-slot .i{width:16px;height:16px}
.add-slot:hover{background:var(--accent-soft);border-style:solid}
.slot-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:2px}
.fl{display:inline-flex}
.fl .i{width:15px;height:15px}
.fl-bad{color:var(--bad)} .fl-warn{color:var(--warn)}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:12.5px;letter-spacing:.02em;background:var(--c);color:var(--c-ink);flex:none}
.av-sm{width:24px;height:24px;font-size:10.5px}
.av-lg{width:44px;height:44px;font-size:15px}

.bench{margin-top:18px;display:grid;gap:8px}
.bench-list{display:flex;flex-wrap:wrap;gap:6px}
.bench-p{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 4px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);font-size:14.5px;font-weight:500}
.bench-p.dim{opacity:.72}

.empty{display:grid;justify-items:start;gap:8px;padding:22px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty b{font-family:var(--f-ui);font-size:18px}
.empty span{color:var(--muted)}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-family:var(--f-ui);font-size:12.5px;font-weight:600;white-space:nowrap;vertical-align:middle}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-info{background:var(--info-soft);color:var(--info)}
.t-muted{background:var(--sunken);color:var(--muted)}
.t-money{background:var(--money-soft);color:var(--money)}
.t-best{background:var(--accent);color:var(--accent-ink)}

/* ---------- week grid ---------- */
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);overscroll-behavior-x:contain}
.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;table-layout:fixed}
.grid col.c-who{width:190px}
.grid th,.grid td{border-bottom:1px solid var(--line-2);vertical-align:top;padding:5px}
.grid td{border-left:1px solid var(--line-2)}
.grid thead th{background:var(--surface-2);font-weight:normal;padding:0;text-align:left;border-left:1px solid var(--line-2)}
.grid thead th.corner{border-left:0;padding:10px 12px;vertical-align:bottom}
.grid .who,.grid .corner{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line-2)}
.grid thead .corner{background:var(--surface-2)}
.grid td.is-today{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.grid thead th.is-today{background:color-mix(in srgb,var(--accent) 12%,var(--surface-2))}
.gh{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 7px;width:100%;padding:8px 10px}
.gh-dow{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gh-num{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.gh .dp-cov{margin-left:auto}
.who-in{display:flex;align-items:center;gap:9px;width:100%;min-width:0;padding:3px 4px;border-radius:8px;text-align:left}
.who-in:hover{background:var(--surface-2)}
.who-t{display:flex;flex-direction:column;min-width:0;flex:1}
.who-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- small utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');

/* dates are 'YYYY-MM-DD' strings; day numbers are days since 1970-01-01 (UTC math, DST-proof) */
const dnum = d => Math.round(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5);

const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
const weekStartOf = (d, ws) => addDays(d, -((weekday(d) - ws + 7) % 7));
const weekDates = ws => Array.from({ length: 7 }, (_, i) => addDays(ws, i));
const tmin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };

function shiftSpan(s) {

const shiftMins = s => { const [a, b] = shiftSpan(s); return b - a; };

/* ---------- formatting ---------- */
let FMT = '12';

}
const fmtRange = (a, b, long) => `${fmtT(a, long)}${long ? ' to ' : '–'}${fmtT(b, long)}`;
const fmtH = h => { const r = Math.round(h * 10) / 10; return (Number.isInteger(r) ? r : r.toFixed(1)).toString(); };
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const money2 = n => '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDay = d => `${DOW[weekday(d)]} ${MON[+d.slice(5, 7) - 1]} ${+d.slice(8)}`;
const fmtDayLong = d => `${DOWL[weekday(d)]}, ${MONL[+d.slice(5, 7) - 1]} ${+d.slice(8)}`;
const fmtMD = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
function fmtWeekRange(ws, long) {
  const we = addDays(ws, 6);
  const m1 = +ws.slice(5, 7) - 1, m2 = +we.slice(5, 7) - 1;
  const M = long ? MONL : MON;
  const sep = long ? ' to ' : ' – ';
  return m1 === m2 ? `${M[m1]} ${+ws.slice(8)}${sep}${+we.slice(8)}` : `${M[m1]} ${+ws.slice(8)}${sep}${M[m2]} ${+we.slice(8)}`;
}
function fmtStamp(ms) {
  const d = new Date(ms);

  return `${MON[d.getMonth()]} ${d.getDate()}, ${fmtT(t, true)}`;
}
const initials = name => (String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('') || '?').toUpperCase();
const firstName = name => String(name || '').trim().split(/\s+/)[0] || name;

function hexRgb(hex) { const h = hex.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function lum(hex) { return hexRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0); }
function textOn(hex) { const L = lum(hex); const cw = 1.05 / (L + 0.05), cb = (L + 0.05) / (lum('#111418') + 0.05); return cw >= cb ? '#FFFFFF' : '#111418'; }
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => pad(Math.round(v * t + B[i] * (1 - t)).toString(16))).join(''); }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

/* ---------- state ---------- */

const allAvail = () => Array.from({ length: 7 }, () => ({ mode: 'all' }));

    maxHours: 40, minHours: 0, avail: allAvail(), timeOff: [], active: true, notes: ''
  }, extra || {});
}
function emptyState() {

}

function migrate(s) {
  if (!s || typeof s !== 'object') return null;
  s.settings = Object.assign(defaultSettings(), s.settings || {});
  ['staff', 'types', 'needs', 'shifts'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.weeks || typeof s.weeks !== 'object') s.weeks = {};
  s.staff.forEach(p => {
    if (!Array.isArray(p.avail) || p.avail.length !== 7) p.avail = allAvail();
    if (!Array.isArray(p.timeOff)) p.timeOff = [];
    if (!Array.isArray(p.roles) || !p.roles.length) p.roles = [s.settings.roles[0] || 'Bartender'];
    if (p.active === undefined) p.active = true;
  });
  s.needs.forEach(n => { if (!Array.isArray(n.counts) || n.counts.length !== 7) n.counts = [0, 0, 0, 0, 0, 0, 0]; });
  return s;
}
function load() {
  const raw = store.get(KEY);
  if (!raw) return null;
  try { return migrate(JSON.parse(raw)); } catch (e) { return null; }
}
let S = null;
function save() { store.set(KEY, JSON.stringify(S)); }

/* ---------- lookups ---------- */
const staffById = id => S.staff.find(p => p.id === id);
const typeById = id => S.types.find(t => t.id === id);
const typeName = s => { const t = s.typeId && typeById(s.typeId); return t ? t.name : 'Custom'; };
const typeColor = s => { const t = s.typeId && typeById(s.typeId); return t ? t.color : '#6B7A8C'; };
const shiftsBetween = (from, to) => S.shifts.filter(s => s.date >= from && s.date <= to);
const isActive = p => p.active !== false;
function orderedStaff(list) {
  const roles = S.settings.roles;
  return (list || S.staff).slice().sort((a, b) => {
    const ra = roles.indexOf(a.roles[0]), rb = roles.indexOf(b.roles[0]);
    return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb) || a.name.localeCompare(b.name);
  });
}

/* ---------- NY rule helpers ---------- */
function inTimeOff(p, d) { return (p.timeOff || []).some(r => d >= r.from && d <= (r.to || r.from)); }
function timeOffNote(p, d) { const r = (p.timeOff || []).find(x => d >= x.from && d <= (x.to || x.from)); return r ? (r.note || 'Time off') : ''; }
function availFor(p, d) { return (p.avail && p.avail[weekday(d)]) || { mode: 'all' }; }
function availFit(p, sh) {
  const a = availFor(p, sh.date);
  if (a.mode === 'all') return { ok: true };
  if (a.mode === 'off') return { ok: false, hard: true, text: `Unavailable ${DOW[weekday(sh.date)]}` };
  const base = dnum(sh.date) * 1440;
  const f = base + tmin(a.from);
  let t = base + tmin(a.to);
  if (t <= f) t += 1440;
  const [x, y] = shiftSpan(sh);
  if (x >= f && y <= t) return { ok: true };
  return { ok: false, hard: false, text: `Only ${fmtRange(a.from, a.to)}` };
}
function isMoney(sh) { return S.settings.busyNights.includes(weekday(sh.date)) && tmin(sh.start) >= 17 * 60; }
/* NY Labor Law §162 meal periods (non-factory) */
function mealRule(sh) {
  const m = shiftMins(sh);
  if (m <= 360) return { total: 0, text: '' };
  const st = tmin(sh.start);
  if (st >= 13 * 60 || st < 6 * 60) {
    const mid = Math.round((st + m / 2) / 15) * 15;
    return { total: 45, text: `45 min meal break around ${fmtT(mstr(mid), true)}` };
  }
  const [a, b] = shiftSpan(sh);
  const base = dnum(sh.date) * 1440;
  let total = 0; const parts = [];
  if (a < base + 14 * 60 && b > base + 11 * 60) { total += 30; parts.push('30 min meal between 11am and 2pm'); }
  if (st < 11 * 60 && b > base + 19 * 60) { total += 20; parts.push('20 more minutes between 5pm and 7pm'); }
  return { total, text: parts.join(', plus ') };
}
/* longest stretch with no work inside [lo, hi) — NY Labor Law §161 needs 24 h in the week */
function maxFreeGap(spans, lo, hi) {
  const iv = spans.map(([a, b]) => [Math.max(a, lo), Math.min(b, hi)]).filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
  let cur = lo, best = 0;
  for (const [a, b] of iv) { best = Math.max(best, a - cur); cur = Math.max(cur, b); }
  return Math.max(best, hi - cur);
}

/* ---------- coverage ---------- */
function coverageFor(d, weekShifts) {
  const wd = weekday(d);
  const dayShifts = weekShifts.filter(s => s.date === d);
  const used = new Set();
  const rows = [];
  for (const n of S.needs) {
    if (!typeById(n.typeId)) continue;
    const need = n.counts[wd] || 0;
    const assigned = dayShifts.filter(s => s.typeId === n.typeId && s.role === n.role && !used.has(s.id));
    if (!need && !assigned.length) continue;
    assigned.forEach(s => used.add(s.id));
    rows.push({ n, need, assigned, missing: Math.max(0, need - assigned.length) });
  }
  const extras = dayShifts.filter(s => !used.has(s.id));
  const needed = rows.reduce((a, r) => a + r.need, 0);
  const filled = rows.reduce((a, r) => a + Math.min(r.need, r.assigned.length), 0);
  return { rows, extras, needed, filled, missing: needed - filled, count: dayShifts.length, dayShifts };
}

/* ---------- pay estimate (NY hospitality wage order) ---------- */
function payFor(p, rec) {
  const set = S.settings;
  const hrs = rec.paidMins / 60;
  const ot = Math.max(0, hrs - set.otAfter);
  const reg = hrs - ot;
  const rate = +p.rate || 0;
  const tc = p.tipped ? +set.tipCredit : 0;
  const otRate = p.tipped ? 1.5 * (rate + tc) - tc : 1.5 * rate;
  const spreadPay = rec.spreadDays * set.minWage;
  return { hrs, reg, ot, rate, otRate, spreadPay, total: reg * rate + ot * otRate + spreadPay };
}

/* ---------- weekly analysis: flags, issues, hours, cost ---------- */
function analyze(ws) {
  const set = S.settings;
  const days = weekDates(ws), we = days[6];
  const lo = dnum(ws) * 1440, hi = lo + 7 * 1440;
  const week = shiftsBetween(ws, we);
  const near = shiftsBetween(addDays(ws, -1), addDays(we, 1));
  const flags = {};
  const addFlag = (sh, sev, text) => { (flags[sh.id] = flags[sh.id] || []).push({ sev, text }); };
  const issues = [];
  const per = {};
  for (const p of S.staff) per[p.id] = { p, mins: 0, paidMins: 0, shifts: [], spreadDays: 0, money: 0, days: new Set() };

  let mealCount = 0;
  for (const sh of week) {
    const p = staffById(sh.staffId);
    if (!p) continue;
    const r = per[p.id];
    const m = shiftMins(sh);
    const meal = mealRule(sh);
    if (meal.total) mealCount++;
    r.mins += m;
    r.paidMins += m - (set.deductMeals ? meal.total : 0);
    r.shifts.push(sh);
    r.days.add(sh.date);
    if (isMoney(sh)) r.money++;
    if (inTimeOff(p, sh.date)) {
      addFlag(sh, 'bad', 'Time off');
      issues.push({ sev: 'bad', date: sh.date, shiftId: sh.id, text: `${p.name} is on time off ${fmtDay(sh.date)} (${timeOffNote(p, sh.date)}) but is scheduled for ${typeName(sh)}.` });
    }
    const av = availFit(p, sh);
    if (!av.ok) {
      addFlag(sh, 'warn', av.text);
      const a = availFor(p, sh.date);
      issues.push({ sev: 'warn', date: sh.date, shiftId: sh.id, text: a.mode === 'off' ? `${p.name} is scheduled ${fmtDay(sh.date)} but can't work ${DOWL[weekday(sh.date)]}s.` : `${p.name} is scheduled ${fmtRange(sh.start, sh.end)} on ${fmtDay(sh.date)} but is only available ${fmtRange(a.from, a.to)}.` });
    }
    if (!p.roles.includes(sh.role)) {
      addFlag(sh, 'info', `Covering as ${sh.role}`);
    }
    if (!isActive(p)) {
      addFlag(sh, 'warn', 'Inactive');
      issues.push({ sev: 'warn', date: sh.date, shiftId: sh.id, text: `${p.name} is marked inactive but has a shift ${fmtDay(sh.date)}.` });
    }
  }

  for (const id of Object.keys(per)) {
    const r = per[id];
    if (!r.shifts.length) continue;
    const p = r.p;
    const mine = near.filter(s => s.staffId === id).map(s => ({ s, span: shiftSpan(s) })).sort((x, y) => x.span[0] - y.span[0]);
    for (let i = 1; i < mine.length; i++) {
      const a = mine[i - 1], b = mine[i];
      const touches = (a.s.date >= ws && a.s.date <= we) || (b.s.date >= ws && b.s.date <= we);
      if (!touches) continue;
      const gap = b.span[0] - a.span[1];
      if (gap < 0) {
        addFlag(a.s, 'bad', 'Overlaps another shift'); addFlag(b.s, 'bad', 'Overlaps another shift');
        issues.push({ sev: 'bad', date: b.s.date, shiftId: b.s.id, text: `${p.name} is double-booked: ${typeName(a.s)} and ${typeName(b.s)} overlap on ${fmtDay(b.s.date)}.` });
      } else if (a.s.date !== b.s.date && set.minRest > 0 && gap < set.minRest * 60) {
        addFlag(b.s, 'warn', `${fmtH(gap / 60)}h rest`);
        issues.push({ sev: 'warn', date: b.s.date, shiftId: b.s.id, text: `${p.name} gets only ${fmtH(gap / 60)}h off between ${typeName(a.s)} (${fmtDay(a.s.date)}) and ${typeName(b.s)} (${fmtDay(b.s.date)}). Your minimum is ${set.minRest}h.` });
      }
    }
    // spread of hours (12 NYCRR 146-1.6): workday span over 10h earns 1 extra hour at minimum wage
    const byDate = {};
    r.shifts.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
    for (const d of Object.keys(byDate)) {
      const spans = byDate[d].map(shiftSpan);
      const spread = Math.max(...spans.map(x => x[1])) - Math.min(...spans.map(x => x[0]));
      if (spread > 600) {
        r.spreadDays++;
        byDate[d].forEach(s => addFlag(s, 'info', 'Spread of hours +1h pay'));
        issues.push({ sev: 'info', date: d, text: `${p.name}'s workday on ${fmtDay(d)} spans ${fmtH(spread / 60)}h. NY spread of hours rule adds 1 hour at minimum wage (${money2(set.minWage)}).` });
      }
    }
    const hrs = r.paidMins / 60;
    if (hrs > set.otAfter) issues.push({ sev: 'warn', staffId: id, text: `${p.name} is at ${fmtH(hrs)}h: ${fmtH(hrs - set.otAfter)}h of overtime at time and a half.` });
    if (p.maxHours && hrs > p.maxHours) issues.push({ sev: 'warn', staffId: id, text: `${p.name} is over their ${p.maxHours}h weekly max (${fmtH(hrs)}h).` });
    if (maxFreeGap(mine.map(x => x.span), lo, hi) < 1440) issues.push({ sev: 'warn', staffId: id, text: `${p.name} has no 24 hours off in a row this week (NY Labor Law §161 day of rest).` });
    if (p.minHours && hrs < p.minHours) issues.push({ sev: 'info', staffId: id, text: `${p.name} has ${fmtH(hrs)}h, under the ${p.minHours}h they asked for.` });
  }

  const cov = {};
  for (const d of days) {
    cov[d] = coverageFor(d, week);
    for (const row of cov[d].rows) {
      if (row.missing > 0) {
        const t = typeById(row.n.typeId);
        issues.push({ sev: 'warn', date: d, gap: true, text: `${fmtDay(d)}: ${t.name} needs ${row.missing} more ${row.n.role.toLowerCase()}${row.missing > 1 ? 's' : ''}.` });
      }
    }
  }
  if (mealCount) issues.push({ sev: 'info', text: `${mealCount} shift${mealCount > 1 ? 's run' : ' runs'} over 6 hours and need${mealCount > 1 ? '' : 's'} a meal break (NY Labor Law §162). Break times are on each shift.` });

  const order = { bad: 0, warn: 1, info: 2 };
  issues.sort((a, b) => order[a.sev] - order[b.sev] || String(a.date || '9').localeCompare(String(b.date || '9')));

  let totalMins = 0, totalPay = 0, totalOT = 0, spreadDays = 0;
  for (const id of Object.keys(per)) {
    const r = per[id];
    r.pay = payFor(r.p, r);
    totalMins += r.paidMins; totalPay += r.pay.total; totalOT += r.pay.ot; spreadDays += r.spreadDays;
  }
  const needed = days.reduce((a, d) => a + cov[d].needed, 0);
  const filled = days.reduce((a, d) => a + cov[d].filled, 0);
  const counts = { bad: 0, warn: 0, info: 0 };
  issues.forEach(i => counts[i.sev]++);
  return { ws, days, week, flags, issues, counts, per, cov, totals: { mins: totalMins, pay: totalPay, ot: totalOT, spreadDays, needed, filled, shifts: week.length } };
}

/* ---------- candidate scoring (picker + auto-fill) ---------- */
function evaluate(p, slot, ctx) {
  ctx = ctx || {};
  const set = S.settings;
  const tags = [];
  let hard = false, block = false;
  const sh = { date: slot.date, start: slot.start, end: slot.end };
  const [a, b] = shiftSpan(sh);
  const len = b - a;
  const role = slot.role;
  const roleOk = !role || p.roles.includes(role);
  if (!roleOk) { tags.push(['muted', `Not a ${role.toLowerCase()}`]); block = true; }
  if (inTimeOff(p, slot.date)) { tags.push(['bad', `Time off: ${timeOffNote(p, slot.date)}`]); hard = block = true; }
  const av = availFit(p, sh);
  if (!av.ok) { tags.push([av.hard ? 'bad' : 'warn', av.text]); block = true; if (av.hard) hard = true; }
  const pool = ctx.pool || S.shifts;
  const mine = pool.filter(s => s.staffId === p.id && s.id !== ctx.excludeId);
  let restMin = Infinity, sameDay = false;
  for (const s of mine) {
    const [x, y] = shiftSpan(s);
    if (x < b && y > a) { tags.push(['bad', `Already on ${typeName(s)} ${fmtRange(s.start, s.end)}`]); hard = block = true; continue; }
    if (s.date === slot.date) { sameDay = true; continue; }
    restMin = Math.min(restMin, y <= a ? a - y : x - b);
  }
  if (sameDay && !hard) { tags.push(['warn', 'Double shift']); block = true; }
  if (set.minRest > 0 && restMin < set.minRest * 60) { tags.push(['warn', `Only ${fmtH(restMin / 60)}h rest`]); block = true; }
  const ws = weekStartOf(slot.date, set.weekStart), we = addDays(ws, 6);
  const wk = mine.filter(s => s.date >= ws && s.date <= we);
  const cur = wk.reduce((t, s) => t + shiftMins(s), 0);
  const after = cur + len;
  if (after > set.otAfter * 60) { tags.push(['warn', `Overtime +${fmtH((after - set.otAfter * 60) / 60)}h`]); if (!ctx.allowOT) block = true; }
  if (p.maxHours && after > p.maxHours * 60) { tags.push(['warn', `Over ${p.maxHours}h max`]); block = true; }
  const lo = dnum(ws) * 1440, hi = lo + 7 * 1440;
  const spans = mine.filter(s => s.date >= addDays(ws, -1) && s.date <= addDays(we, 1)).map(shiftSpan).concat([[a, b]]);
  if (maxFreeGap(spans, lo, hi) < 1440) { tags.push(['warn', 'No day off left']); block = true; }
  const moneyShift = isMoney(sh);
  const moneyCount = wk.filter(isMoney).length;
  let score = 100 - (cur / Math.max(60, (p.maxHours || 40) * 60)) * 50;
  if (moneyShift) score -= moneyCount * 14;
  if (roleOk && p.roles[0] === role) score += 8;
  if (p.minHours && cur < p.minHours * 60) score += 20;
  if (!isActive(p)) { block = true; tags.push(['muted', 'Inactive']); }
  return { p, tags, hard, block, score, cur, after, money: moneyShift, moneyCount, roleOk };
}
const cmpCand = (x, y) => (x.block - y.block) || (x.hard - y.hard) || (y.score - x.score) || x.p.name.localeCompare(y.p.name);

/* ---------- auto-fill: most constrained slot first, fairest person first ---------- */
function openSlots(ws) {
  const days = weekDates(ws);
  const week = shiftsBetween(ws, days[6]);
  const slots = [];
  for (const d of days) {
    const cov = coverageFor(d, week);
    for (const r of cov.rows) {
      const t = typeById(r.n.typeId);
      for (let i = 0; i < r.missing; i++) slots.push({ date: d, typeId: t.id, role: r.n.role, start: t.start, end: t.end });
    }
  }
  return slots;
}
function blockReason(slot) {
  const counts = {};
  const pool = shiftsBetween(addDays(slot.date, -8), addDays(slot.date, 8));
  S.staff.filter(isActive).forEach(p => {
    const c = evaluate(p, slot, { pool });
    if (!c.roleOk) return;
    const t = c.tags.find(x => x[0] === 'bad') || c.tags.find(x => x[0] === 'warn');
    if (!t) return;
    const k = t[1].replace(/Time off:.*/, 'time off').replace(/Only \d.*h rest/, 'too little rest').replace(/Unavailable.*/, 'unavailable').replace(/Only .*/, 'outside their hours').replace(/Over \d+h max/, 'at max hours').replace(/Overtime.*/, 'would hit overtime').replace(/Already on.*/, 'already working').replace('Double shift', 'already working that day').replace('No day off left', 'need a day off');
    counts[k] = (counts[k] || 0) + 1;
  });
  const parts = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v} ${k}`);
  return parts.length ? parts.join(', ') : `nobody on the team is a ${slot.role.toLowerCase()}`;
}
function autoFill(ws, opts) {
  opts = opts || {};
  const we = addDays(ws, 6);
  if (opts.rebuild) S.shifts = S.shifts.filter(s => !(s.auto && s.date >= ws && s.date <= we));
  const slots = openSlots(ws);
  const total = slots.length;
  const active = S.staff.filter(isActive);
  let filled = 0;
  while (slots.length) {
    const pool = shiftsBetween(addDays(ws, -8), addDays(we, 8));
    let pick = null;
    for (const sl of slots) {
      const cands = active.map(p => evaluate(p, sl, { pool, allowOT: opts.allowOT })).filter(c => !c.block);
      if (!cands.length) continue;
      const key = [cands.length, isMoney(sl) ? 0 : 1, sl.date, sl.start];
      if (!pick || cmpKey(key, pick.key) < 0) pick = { sl, cands, key };
    }
    if (!pick) break;
    pick.cands.sort((x, y) => y.score - x.score || x.p.name.localeCompare(y.p.name));
    const c = pick.cands[0];
    S.shifts.push({ id: uid(), staffId: c.p.id, date: pick.sl.date, start: pick.sl.start, end: pick.sl.end, typeId: pick.sl.typeId, role: pick.sl.role, note: '', auto: true });
    slots.splice(slots.indexOf(pick.sl), 1);
    filled++;
  }
  return { total, filled, unfilled: slots.map(sl => Object.assign(sl, { reason: blockReason(sl) })) };
}
function cmpKey(a, b) { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; }

/* ---------- week meta ---------- */
function weekHash(ws) {
  const arr = shiftsBetween(ws, addDays(ws, 6)).map(s => [s.staffId, s.date, s.start, s.end, s.typeId || '', s.role].join('|')).sort();
  return hashStr(JSON.stringify(arr));
}
function weekStatus(ws) {
  const m = S.weeks[ws];
  if (!m || !m.sentAt) return 'draft';
  return m.hash === weekHash(ws) ? 'sent' : 'changed';
}
function copyWeek(fromWs, toWs) {
  const off = dnum(toWs) - dnum(fromWs);
  const src = shiftsBetween(fromWs, addDays(fromWs, 6));
  let n = 0;
  for (const s of src) {
    const copy = Object.assign({}, s, { id: uid(), date: addDays(s.date, off), auto: false });
    const [a, b] = shiftSpan(copy);
    const clash = S.shifts.some(x => x.staffId === copy.staffId && (() => { const [c, d] = shiftSpan(x); return c < b && d > a; })());
    if (clash) continue;
    S.shifts.push(copy); n++;
  }
  return n;
}

function dutyChart(d, week) {

  const h0 = Math.floor((Math.min(...spans.map(x => x.sp[0])) - base) / 60);
  const h1 = Math.ceil((Math.max(...spans.map(x => x.sp[1])) - base) / 60);

  }
  const max = Math.max(1, ...cols.map(c => c.a + c.b));

  if (orphan.length) {
    cards.push(`<section class="slot"><header class="slot-head"><span class="swatch" style="--c:#6B7A8C"></span><div class="slot-title"><b>Custom shifts</b><span>Times set by hand</span></div></header>
      <div class="slot-body"><div class="people">${orphan.map(s => personChip(s, A)).join('')}</div></div></section>`);
  }
  const working = new Set(cov.dayShifts.map(s => s.staffId));
  const bench = orderedStaff(S.staff.filter(isActive)).filter(p => !working.has(p.id));
  const benchHtml = bench.map(p => {
    const to = inTimeOff(p, d), a = availFor(p, d);
    const tag = to ? ['bad', 'Time off'] : a.mode === 'off' ? ['muted', 'Unavailable'] : a.mode === 'hours' ? ['info', fmtRange(a.from, a.to)] : ['ok', `${fmtH((A.per[p.id] ? A.per[p.id].mins : 0) / 60)}h so far`];
    return `<button class="bench-p${to || a.mode === 'off' ? ' dim' : ''}" data-act="cell" data-p="${p.id}" data-d="${d}">${avatar(p, 'sm')}<span>${esc(firstName(p.name))}</span>${tagHtml(tag)}</button>`;
  }).join('');
  return `${dayStrip(A)}
    <div class="day-head">
      <div><h2 class="day-title">${DOWL[weekday(d)]}</h2><div class="day-sub">${MONL[+d.slice(5, 7) - 1]} ${+d.slice(8)} · ${cov.needed ? `${cov.filled} of ${cov.needed} spots filled` : 'No staffing targets set'}${money ? ' · busy night' : ''}</div></div>
      <button class="btn btn-sm" data-act="add-shift" data-d="${d}">${ICON.plus}Add shift</button>
    </div>
    ${dutyChart(d, A.week)}
    ${cards.length ? `<div class="slots">${cards.join('')}</div>` : `<div class="empty"><b>Nothing planned for ${DOWL[weekday(d)]}.</b><span>Set how many people you need in Setup, or add a shift by hand.</span><button class="btn btn-sm btn-accent" data-act="add-shift" data-d="${d}">${ICON.plus}Add shift</button></div>`}
    ${bench.length ? `<section class="bench"><h3 class="lbl">Not working ${DOW[weekday(d)]}</h3><div class="bench-list">${benchHtml}</div></section>` : ''}`;
}

/* ----- week grid ----- */
function vWeek(A) {
  const today = todayStr();
  const people = orderedStaff(S.staff.filter(p => isActive(p) || (A.per[p.id] && A.per[p.id].shifts.length)));
  if (!people.length) return `<div class="empty"><b>No one on the team yet.</b><span>Add bartenders and barbacks in Team, then come back to build the week.</span><button class="btn btn-sm btn-accent" data-act="tab" data-tab="team">${ICON.users}Go to Team</button></div>`;
  const head = A.days.map(d => {
    const c = A.cov[d];
    const state = c.needed === 0 ? 'none' : c.missing === 0 ? 'full' : 'short';
    return `<th scope="col" class="${d === today ? 'is-today' : ''}"><button class="gh" data-act="goto-day" data-d="${d}"><span class="gh-dow">${DOW[weekday(d)]}</span><span class="gh-num num">${+d.slice(8)}</span><span class="dp-cov cov-${state} num">${c.needed ? `${c.filled}/${c.needed}` : ''}</span></button></th>`;
  }).join('');
  const rows = people.map(p => {
    const r = A.per[p.id] || { mins: 0, paidMins: 0, shifts: [] };
    const hrs = r.paidMins / 60;
    const max = p.maxHours || S.settings.otAfter;
    const over = hrs > Math.min(max, S.settings.otAfter);
    const cells = A.days.map(d => {
      const list = r.shifts.filter(s => s.date === d).sort((a, b) => shiftSpan(a)[0] - shiftSpan(b)[0]);
      if (list.length) {
        return `<td class="${d === today ? 'is-today' : ''}">${list.map(s => {
          const t = s.typeId && typeById(s.typeId);
          const cross = s.role !== p.roles[0];
          return `<button class="chip" style="--c:${typeColor(s)}" data-act="edit-shift" data-id="${s.id}"><b>${esc(t ? t.name : 'Custom')}</b><span class="num">${fmtRange(s.start, s.end)}${cross ? ` · ${esc(s.role)}` : ''}</span>${flagIcon(A.flags[s.id])}</button>`;
        }).join('')}<button class="cell-more" data-act="cell" data-p="${p.id}" data-d="${d}" aria-label="Add another shift for ${esc(p.name)}">${ICON.plus}</button></td>`;
      }
      const to = inTimeOff(p, d), a = availFor(p, d);
      const cls = to ? 'cell-add cell-to' : a.mode === 'off' ? 'cell-add cell-off' : 'cell-add';
      const label = to ? 'Time off' : a.mode === 'off' ? 'Off' : a.mode === 'hours' ? `<span class="num">${fmtRange(a.from, a.to)}</span>` : ICON.plus;
      return `<td class="${d === today ? 'is-today' : ''}"><button class="${cls}" data-act="cell" data-p="${p.id}" data-d="${d}" aria-label="Schedule ${esc(p.name)} on ${fmtDay(d)}">${label}</button></td>`;
    }).join('');
    return `<tr><th scope="row" class="who"><button class="who-in" data-act="person" data-id="${p.id}">${avatar(p)}<span class="who-t"><span class="who-name">${esc(p.name)}</span><span class="who-hrs num${over ? ' over' : ''}">${fmtH(hrs)}h${p.maxHours ? ` / ${p.maxHours}` : ''}${r.money ? ` · ${r.money} busy` : ''}</span><span class="hbar${over ? ' over' : ''}"><i style="width:${clamp(hrs / max * 100, 0, 100)}%"></i></span></span></button></th>${cells}</tr>`;
  }).join('');
  const foot = A.days.map(d => {
    const c = A.cov[d];
    const hrs = c.dayShifts.reduce((a, s) => a + shiftMins(s), 0) / 60;
    return `<td>${c.missing ? `<button class="gap-btn" data-act="goto-day" data-d="${d}">${c.missing} open</button>` : `<span class="gf-ok">${c.needed ? ICON.check : ''}</span>`}<span class="gf-h num">${fmtH(hrs)}h</span></td>`;
  }).join('');
  return `<div class="grid-wrap" id="grid-wrap"><table class="grid">
    <colgroup><col class="c-who">${A.days.map(() => '<col>').join('')}</colgroup>
    <thead><tr><th scope="col" class="corner"><span class="lbl">Team</span></th>${head}</tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><th scope="row" class="who"><span class="lbl">Open spots</span></th>${foot}</tr></tfoot>
  </table></div>
  <p class="hint grid-hint">${ICON.info}Tap an empty box to schedule someone. Tap a shift to change or remove it.</p>`;
}

/* ----- issues + cost ----- */
function vIssueList(A, limit) {
  const list = A.issues.filter(i => i.sev !== 'info' || !limit);
  const shown = limit ? list.slice(0, limit) : list;
  if (!A.issues.length || (limit && !list.length)) return `<div class="allgood">${ICON.check}<span>Nothing to fix. Coverage, rest and hours look right.</span></div>`;
  const html = shown.map(i => `<button class="issue sev-${i.sev}" data-act="issue" ${i.shiftId ? `data-shift="${i.shiftId}"` : ''} ${i.date ? `data-d="${i.date}"` : ''} ${i.staffId ? `data-p="${i.staffId}"` : ''}>${SEV_ICON[i.sev]}<span>${esc(i.text)}</span></button>`).join('');
  const more = limit && list.length > limit ? `<button class="linkbtn" data-act="open-issues">See all ${list.length}</button>` : '';
  return `<div class="issues">${html}</div>${more}`;
}
function vCostMini(A) {
  const t = A.totals;
  const meta = S.weeks[A.ws] || {};
  const pct = meta.forecast ? (t.pay / meta.forecast) * 100 : null;
  return `<dl class="kv">
    <div><dt>Scheduled hours</dt><dd class="num">${fmtH(t.mins / 60)}h</dd></div>
    <div><dt>Overtime</dt><dd class="num${t.ot ? ' warn' : ''}">${fmtH(t.ot)}h</dd></div>
    <div><dt>Spread of hours pay</dt><dd class="num">${t.spreadDays ? `${t.spreadDays}× ${money2(S.settings.minWage)}` : 'None'}</dd></div>
    <div class="kv-total"><dt>Wages before tips</dt><dd class="num">${money(t.pay)}</dd></div>
    ${pct !== null ? `<div><dt>Labor vs. sales forecast</dt><dd class="num">${pct.toFixed(1)}%</dd></div>` : ''}
  </dl><button class="linkbtn" data-act="open-cost">By person</button>`;
}

/* ---------------- team ---------------- */
function vTeam(A) {
  const active = orderedStaff(S.staff.filter(isActive));
  const inactive = orderedStaff(S.staff.filter(p => !isActive(p)));
  const card = p => {
    const r = A.per[p.id] || { paidMins: 0, money: 0 };
    const hrs = r.paidMins / 60;
    const max = p.maxHours || S.settings.otAfter;
    const over = hrs > Math.min(max, S.settings.otAfter);
    const order = [0, 1, 2, 3, 4, 5, 6].map(i => (i + S.settings.weekStart) % 7);
    const avail = order.map(wd => {
      const d = A.days.find(x => weekday(x) === wd);
      const a = p.avail[wd] || { mode: 'all' };
      const to = d && inTimeOff(p, d);
      const cls = to ? 'a-to' : a.mode === 'off' ? 'a-off' : a.mode === 'hours' ? 'a-hours' : 'a-all';
      const title = to ? 'Time off' : a.mode === 'off' ? 'Unavailable' : a.mode === 'hours' ? fmtRange(a.from, a.to) : 'Any time';
      return `<i class="${cls}" title="${DOW[wd]}: ${title}">${DOW[wd][0]}</i>`;
    }).join('');
    return `<button class="pcard" data-act="person" data-id="${p.id}">${avatar(p, 'lg')}
      <span class="pc-main"><span class="pc-top"><b>${esc(p.name)}</b><span class="pc-roles">${p.roles.map(esc).join(' · ')}</span></span>
      <span class="pc-hrs num${over ? ' over' : ''}">${fmtH(hrs)}h this week${p.maxHours ? ` of ${p.maxHours} max` : ''}${r.money ? ` · ${r.money} busy night${r.money > 1 ? 's' : ''}` : ''}</span>
      <span class="hbar${over ? ' over' : ''}"><i style="width:${clamp(hrs / max * 100, 0, 100)}%"></i></span>
      <span class="avail7">${avail}</span></span></button>`;
  };
  return `<div class="page-head"><div><h2 class="page-title">Team</h2><p class="page-sub">${active.length} active · hours for ${fmtWeekRange(A.ws)}</p></div><button class="btn btn-accent" data-act="add-person">${ICON.plus}Add person</button></div>
    ${active.length ? `<div class="team">${active.map(card).join('')}</div>` : `<div class="empty"><b>Add your first bartender.</b><span>Name, role, pay and the days they can work. It takes a minute per person.</span><button class="btn btn-sm btn-accent" data-act="add-person">${ICON.plus}Add person</button></div>`}
    <div class="legend"><i class="a-all"></i>Any time<i class="a-hours"></i>Set hours<i class="a-off"></i>Unavailable<i class="a-to"></i>Time off</div>
    ${inactive.length ? `<h3 class="lbl sect">Inactive</h3><div class="team">${inactive.map(card).join('')}</div>` : ''}`;
}

/* ---------------- setup ---------------- */
function vSetup() {
  const set = S.settings;
  const order = [0, 1, 2, 3, 4, 5, 6].map(i => (i + set.weekStart) % 7);
  const types = S.types.slice().sort((x, y) => ((tmin(x.start) - 360 + 1440) % 1440) - ((tmin(y.start) - 360 + 1440) % 1440));
  const typeRows = types.map(t => `<button class="trow" data-act="type" data-id="${t.id}"><span class="swatch" style="--c:${t.color}"></span><b>${esc(t.name)}</b><span class="num muted">${fmtRange(t.start, t.end)} · ${fmtH(shiftMins({ date: '2026-01-05', start: t.start, end: t.end }) / 60)}h</span>${ICON.right}</button>`).join('');
  const needRows = S.needs.filter(n => typeById(n.typeId)).sort((a, b) => types.indexOf(typeById(a.typeId)) - types.indexOf(typeById(b.typeId)) || set.roles.indexOf(a.role) - set.roles.indexOf(b.role)).map(n => {
    const t = typeById(n.typeId);
    return `<tr><th scope="row"><span class="nr"><span class="swatch" style="--c:${t.color}"></span><span><b>${esc(t.name)}</b><small>${esc(n.role)}</small></span></span></th>
      ${order.map(wd => `<td><input class="ninp num" id="need-${n.id}-${wd}" type="number" inputmode="numeric" min="0" max="20" value="${n.counts[wd] || 0}" data-chg="need" data-id="${n.id}" data-wd="${wd}" aria-label="${esc(t.name)} ${esc(n.role)} ${DOWL[wd]}"></td>`).join('')}
      <td><button class="icon-btn icon-sm" data-act="need-del" data-id="${n.id}" aria-label="Remove row">${ICON.x}</button></td></tr>`;
  }).join('');
  const minW = set.minWage, tc = set.tipCredit;
  return `<div class="page-head"><div><h2 class="page-title">Setup</h2><p class="page-sub">Shift times, how many people you need, and pay rules.</p></div></div>
  <div class="setup">
    <section class="card">
      <div class="card-h"><h3>Shift types</h3><button class="btn btn-sm" data-act="type-add">${ICON.plus}New</button></div>
      <div class="trows">${typeRows || '<p class="muted">No shift types yet.</p>'}</div>
    </section>
    <section class="card card-wide">
      <div class="card-h"><h3>People needed per day</h3></div>
      <p class="muted small">Auto-fill uses these numbers, and the schedule shows open spots against them.</p>
      <div class="needs-wrap" id="needs-wrap"><table class="needs"><thead><tr><th></th>${order.map(wd => `<th scope="col">${DOW[wd]}</th>`).join('')}<th></th></tr></thead><tbody>${needRows}</tbody></table></div>
      <div class="addneed">
        <select class="inp" id="nn-type" aria-label="Shift type">${types.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
        <select class="inp" id="nn-role" aria-label="Role">${set.roles.map(r => `<option>${esc(r)}</option>`).join('')}</select>
        <button class="btn" data-act="need-add">${ICON.plus}Add row</button>
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h3>Bar</h3></div>
      <label class="field"><span>Bar name</span><input class="inp" id="set-bar" value="${esc(set.barName)}" data-chg="set" data-k="barName"></label>
      <div class="row2">
        <label class="field"><span>Week starts</span><select class="inp" id="set-ws" data-chg="set" data-k="weekStart" data-num="1"><option value="1"${set.weekStart === 1 ? ' selected' : ''}>Monday</option><option value="0"${set.weekStart === 0 ? ' selected' : ''}>Sunday</option></select></label>
        <label class="field"><span>Time format</span><select class="inp" id="set-tf" data-chg="set" data-k="timeFormat"><option value="12"${set.timeFormat === '12' ? ' selected' : ''}>4p – 12a</option><option value="24"${set.timeFormat === '24' ? ' selected' : ''}>16:00 – 00:00</option></select></label>
      </div>
      <div class="field"><span>Busy nights</span><div class="chips-sel">${order.map(wd => `<button class="chipbtn" aria-pressed="${set.busyNights.includes(wd)}" data-act="busy" data-wd="${wd}">${DOW[wd]}</button>`).join('')}</div><small class="muted">Evening shifts on these nights earn the most tips. Auto-fill shares them out evenly.</small></div>
      <div class="field"><span>Roles</span><div class="chips-sel">${set.roles.map((r, i) => `<span class="rolechip">${esc(r)}${i > 0 ? `<button data-act="role-del" data-i="${i}" aria-label="Remove ${esc(r)}">${ICON.x}</button>` : ''}</span>`).join('')}</div>
        <div class="inline"><input class="inp" id="role-new" placeholder="Add a role, e.g. Bar lead"><button class="btn" data-act="role-add">Add</button></div></div>
    </section>
    <section class="card">
      <div class="card-h"><h3>Pay and NY rules</h3></div>
      <div class="row2">
        <label class="field"><span>Minimum wage</span><input class="inp num" id="set-mw" type="number" step="0.01" min="0" value="${minW}" data-chg="set" data-k="minWage" data-num="1"></label>
        <label class="field"><span>Tip credit</span><input class="inp num" id="set-tc" type="number" step="0.01" min="0" value="${tc}" data-chg="set" data-k="tipCredit" data-num="1"></label>
        <label class="field"><span>Overtime after (h/week)</span><input class="inp num" id="set-ot" type="number" min="1" value="${set.otAfter}" data-chg="set" data-k="otAfter" data-num="1"></label>
        <label class="field"><span>Min. rest between days (h)</span><input class="inp num" id="set-rest" type="number" min="0" max="24" value="${set.minRest}" data-chg="set" data-k="minRest" data-num="1"></label>
      </div>
      <label class="check"><input type="checkbox" id="set-meal" ${set.deductMeals ? 'checked' : ''} data-chg="set" data-k="deductMeals" data-bool="1"><span>Meal breaks are unpaid (take them out of paid hours)</span></label>
      <p class="muted small">NYC 2026: ${money2(minW)} minimum, tipped cash wage ${money2(minW - tc)}. Tipped overtime is ${money2(1.5 * minW - tc)} an hour.</p>
      <details class="rules"><summary>What the checks are based on</summary>
        <ul>
          <li><b>Overtime.</b> Time and a half after 40 hours in the workweek. For staff paid with the tip credit, the overtime cash rate is 1.5 × the full minimum wage minus the tip credit.</li>
          <li><b>Spread of hours</b> (12 NYCRR 146-1.6). When a workday runs more than 10 hours from first start to last finish, split shifts included, the employee gets one extra hour at the minimum wage. In bars and restaurants this applies to everyone, whatever their rate.</li>
          <li><b>Meal breaks</b> (Labor Law §162). Shifts over 6 hours starting between 1pm and 6am need 45 minutes around the middle. Shifts over 6 hours across 11am to 2pm need 30 minutes in that window, plus 20 minutes between 5pm and 7pm if they start before 11am and run past 7pm.</li>
          <li><b>Day of rest</b> (Labor Law §161). At least 24 hours off in a row every calendar week.</li>
          <li><b>Call-in pay</b> (12 NYCRR 146-1.5). If someone reports for a shift and you send them home, pay at least 3 hours, or the scheduled shift if it is shorter, at the minimum wage.</li>
          <li><b>Rest between days.</b> No NY law sets this for bars. NYC's Fair Workweek clopening rules cover fast food and retail. The ${set.minRest}h minimum here is a house rule you can change or set to 0.</li>
        </ul>
        <p class="muted small">A scheduling aid, not legal advice. Figures from NY DOL for 2026.</p>
      </details>
    </section>
    <section class="card">
      <div class="card-h"><h3>Your data</h3></div>
      <p class="muted small">Everything is saved on this device only. Make a backup file now and then, and use it to move the schedule to another phone or computer.</p>
      <div class="btnrow"><button class="btn" data-act="backup">${ICON.download}Backup file</button>
        <label class="btn filebtn">${ICON.undo}Restore<input type="file" id="restore-file" accept="application/json,.json" data-chg="restore" hidden></label></div>
      <div class="btnrow"><button class="btn" data-act="load-demo">Load example bar</button><button class="btn btn-danger" data-act="erase">${ICON.trash}Erase everything</button></div>
    </section>
  </div>`;
}

/* ============================================================
   Behind the Bar · sheets (dialogs)
   ============================================================ */
function sheetFrame(title, sub, body, foot) {
  return `<div class="sheet-head"><div class="sh-t"><h2 class="sheet-title" id="sheet-title">${title}</h2>${sub ? `<div class="sheet-sub">${sub}</div>` : ''}</div>
    <button class="icon-btn" data-act="sheet-close" aria-label="Close">${ICON.x}</button></div>
    <div class="sheet-body" id="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
}
const chipbtn = (act, val, on, label, extra) => `<button class="chipbtn" aria-pressed="${!!on}" data-act="${act}" data-v="${esc(val)}" ${extra || ''}>${label}</button>`;
function poolFor(d) { const ws = weekStartOf(d, S.settings.weekStart); return shiftsBetween(addDays(ws, -8), addDays(ws, 14)); }

/* ---------- pick a person for a slot ---------- */
function candRow(c, best, confirmId) {
  const tags = c.tags.length ? c.tags : [['ok', 'Free']];
  const extra = c.money && c.moneyCount ? tagHtml(['money', `${c.moneyCount} busy night${c.moneyCount > 1 ? 's' : ''} already`]) : '';
  return `<button class="cand${c.hard ? ' hard' : ''}${confirmId === c.p.id ? ' confirming' : ''}" data-act="pk-assign" data-id="${c.p.id}" data-hard="${c.hard ? 1 : 0}">${avatar(c.p)}
    <span class="cand-main"><span class="cand-name">${esc(c.p.name)}${best ? ' <span class="tag t-best">Best fit</span>' : ''}</span>
    <span class="cand-tags">${tags.map(tagHtml).join('')}${extra}</span>
    ${confirmId === c.p.id ? '<span class="cand-confirm">Tap again to schedule anyway</span>' : ''}</span>
    <span class="cand-hrs num">${fmtH(c.cur / 60)}h<small>then ${fmtH(c.after / 60)}h</small></span></button>`;
}
function shPick() {
  const k = U.sheet;
  const t = k.typeId && typeById(k.typeId);
  const start = t ? t.start : k.start, end = t ? t.end : k.end;
  const slot = { date: k.date, typeId: t ? t.id : null, role: k.role, start, end };
  const pool = poolFor(k.date);
  const ev = S.staff.filter(isActive).map(p => evaluate(p, slot, { pool, allowOT: true })).sort(cmpCand);
  const fit = ev.filter(c => c.roleOk), other = ev.filter(c => !c.roleOk);
  const best = fit.find(c => !c.block);
  const on = t ? S.shifts.filter(s => s.date === k.date && s.typeId === t.id) : [];
  const meal = mealRule(slot);
  const body = `
    <div class="field"><span class="lbl">Shift</span><div class="chips-sel">${S.types.map(x => chipbtn('pk-type', x.id, k.typeId === x.id, `<i class="swatch" style="--c:${x.color}"></i>${esc(x.name)}`)).join('')}${chipbtn('pk-type', '', !t, 'Custom time')}</div></div>
    ${!t ? `<div class="row2"><label class="field"><span>Start</span><input class="inp num" type="time" id="pk-start" value="${start}" data-chg="pk-time" data-k="start"></label><label class="field"><span>End</span><input class="inp num" type="time" id="pk-end" value="${end}" data-chg="pk-time" data-k="end"></label></div>` : ''}
    <div class="field"><span class="lbl">Role</span><div class="chips-sel">${S.settings.roles.map(r => chipbtn('pk-role', r, k.role === r, esc(r))).join('')}</div></div>
    ${on.length ? `<div class="already"><span class="lbl">Already on ${esc(t.name)}</span><div class="people">${on.map(s => { const p = staffById(s.staffId); return p ? `<span class="pchip static">${avatar(p)}<span class="pc-name">${esc(firstName(p.name))}</span><span class="muted small">${esc(s.role)}</span></span>` : ''; }).join('')}</div></div>` : ''}
    ${meal.total ? `<p class="hint">${ICON.info}${esc(meal.text)}</p>` : ''}
    <div class="lbl">${fit.length ? `Who can work it · best first` : `No ${esc(k.role.toLowerCase())}s on the team`}</div>
    <div class="cands">${fit.map(c => candRow(c, best && c.p.id === best.p.id, k.confirmId)).join('')}</div>
    ${other.length ? `<details class="others"><summary>Others on the team (${other.length})</summary><div class="cands">${other.map(c => candRow(c, false, k.confirmId)).join('')}</div></details>` : ''}`;

/* ---------- schedule one person on one day ---------- */
function shCell() {
  const k = U.sheet;
  const p = staffById(k.staffId);
  if (!p) return sheetFrame('Not found', '', '<p>This person was removed.</p>');
  const d = k.date;
  const pool = poolFor(d);
  const cov = coverageFor(d, shiftsBetween(d, d));
  if (!k.role || !p.roles.includes(k.role)) {
    const open = p.roles.find(r => cov.rows.some(x => x.n.role === r && x.missing > 0));
    k.role = open || p.roles[0];
  }
  const role = k.role;
  const mineToday = S.shifts.filter(s => s.staffId === p.id && s.date === d);
  const ws = weekStartOf(d, S.settings.weekStart);
  const hrs = shiftsBetween(ws, addDays(ws, 6)).filter(s => s.staffId === p.id).reduce((a, s) => a + shiftMins(s), 0) / 60;
  const a = availFor(p, d);
  const status = inTimeOff(p, d) ? tagHtml(['bad', `Time off: ${timeOffNote(p, d)}`]) : a.mode === 'off' ? tagHtml(['bad', `Unavailable ${DOW[weekday(d)]}`]) : a.mode === 'hours' ? tagHtml(['info', `Available ${fmtRange(a.from, a.to)}`]) : tagHtml(['ok', 'Available all day']);
  const types = S.types.slice().sort((x, y) => ((tmin(x.start) - 360 + 1440) % 1440) - ((tmin(y.start) - 360 + 1440) % 1440));
  const opts = types.map(t => {
    const c = evaluate(p, { date: d, typeId: t.id, role, start: t.start, end: t.end }, { pool, allowOT: true });
    const row = cov.rows.find(r => r.n.typeId === t.id && r.n.role === role);
    const need = row ? (row.missing ? `<span class="pill cov-short">Needs ${row.missing}</span>` : `<span class="pill cov-full num">Full ${row.assigned.length}/${row.need}</span>`) : '<span class="pill cov-none">Not needed</span>';
    const warn = c.tags.filter(x => x[0] === 'bad' || x[0] === 'warn');
    return `<button class="opt${c.hard ? ' hard' : ''}" data-act="cell-assign" data-t="${t.id}"><span class="swatch" style="--c:${t.color}"></span><span class="opt-main"><b>${esc(t.name)}</b><span class="num muted">${fmtRange(t.start, t.end)}</span>${warn.length ? `<span class="cand-tags">${warn.map(tagHtml).join('')}</span>` : ''}</span>${need}</button>`;
  }).join('');
  const body = `
    <div class="cell-status">${status}<span class="tag t-muted num">${fmtH(hrs)}h this week</span></div>
    ${mineToday.length ? `<div class="field"><span class="lbl">Already scheduled</span><div class="people">${mineToday.map(s => `<button class="chip chip-inline" style="--c:${typeColor(s)}" data-act="edit-shift" data-id="${s.id}"><b>${esc(typeName(s))}</b><span class="num">${fmtRange(s.start, s.end)}</span></button>`).join('')}</div></div>` : ''}
    ${p.roles.length > 1 ? `<div class="field"><span class="lbl">Working as</span><div class="chips-sel">${p.roles.map(r => chipbtn('cell-role', r, r === role, esc(r))).join('')}</div></div>` : ''}
    <div class="field"><span class="lbl">Pick a shift</span><div class="opts">${opts}</div></div>
    <button class="btn btn-block" data-act="cell-custom">${ICON.plus}Custom time</button>`;
  return sheetFrame(esc(p.name), `${fmtDayLong(d)}`, body);
}

/* ---------- file delivery ---------- */
const isTouch = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
async function deliverFile(file, preferShare) {
  if (IN_FRAME) return 'failed';
  if (preferShare && isTouch() && navigator.canShare) {
    try {
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  try {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'downloaded';
  } catch (e) { return 'failed'; }
}
async function copyText(text, fallbackId) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const el = fallbackId && document.getElementById(fallbackId);
    if (el) { el.focus(); el.select && el.select(); try { return document.execCommand('copy'); } catch (e2) { return false; } }
    return false;
  }
}

/* ---------- compact link encoding ---------- */
function b64url(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function packString(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream !== 'undefined') {
    try { const out = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'z' + b64url(new Uint8Array(out)); } catch (e) { /* fall through */ }
  }
  return 'j' + b64url(bytes);
}
async function unpackString(s) {
  const bytes = unb64url(s.slice(1));
  if (s[0] === 'z') { const out = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer(); return new TextDecoder().decode(out); }
  return new TextDecoder().decode(bytes);
}
function staffPayload(A) {
  const people = orderedStaff(S.staff).filter(p => A.per[p.id] && A.per[p.id].shifts.length);
  const pIdx = new Map(people.map((p, i) => [p.id, i]));
  const tIdx = new Map(S.types.map((t, i) => [t.id, i]));
  return {
    v: 1, b: S.settings.barName, w: A.ws, f: S.settings.timeFormat, m: S.settings.roles[0],
    p: people.map(p => [p.name, p.color, p.roles[0] || '']),
    t: S.types.map(t => [t.name, t.color]),
    s: A.week.filter(s => pIdx.has(s.staffId)).map(s => [pIdx.get(s.staffId), dnum(s.date) - dnum(A.ws), s.start, s.end, tIdx.has(s.typeId) ? tIdx.get(s.typeId) : -1, s.role, s.note || '']),
    u: Date.now()
  };
}
async function makeLink(A) { return location.origin + location.pathname + '#v=' + await packString(JSON.stringify(staffPayload(A))); }

/* ---------- plain text for the group chat (no dashes, reads well in SMS) ---------- */
function scheduleText(A) {
  const main = S.settings.roles[0];
  const L = [S.settings.barName, `Schedule for ${fmtWeekRange(A.ws, true)}`, ''];
  for (const d of A.days) {
    const list = A.week.filter(s => s.date === d).sort((a, b) => shiftSpan(a)[0] - shiftSpan(b)[0] || typeName(a).localeCompare(typeName(b)));
    L.push(`${DOWL[weekday(d)].toUpperCase()} ${fmtMD(d)}`);
    if (!list.length) { L.push('No shifts', ''); continue; }
    const groups = new Map();
    for (const s of list) {
      const key = `${typeName(s)} ${fmtRange(s.start, s.end, true)}`;
      const p = staffById(s.staffId);
      if (!p) continue;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p.name + (s.role !== main ? ` (${s.role.toLowerCase()})` : '') + (s.note ? `, note: ${s.note}` : ''));
    }
    groups.forEach((names, key) => L.push(`${key}: ${names.join(', ')}`));
    L.push('');
  }
  return L.join('\n').trim();
}

/* ---------- calendar (.ics) ---------- */
const VTZ = ['BEGIN:VTIMEZONE', 'TZID:America/New_York', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0400', 'TZNAME:EDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:-0400', 'TZOFFSETTO:-0500', 'TZNAME:EST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE'];
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
function icsStamp(absMin) { const day = Math.floor(absMin / 1440), m = absMin - day * 1440; return dstr(day).replace(/-/g, '') + 'T' + pad(Math.floor(m / 60)) + pad(m % 60) + '00'; }
function buildICS(events) {
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Behind the Bar//Schedule//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'].concat(VTZ);
  for (const e of events) {
    const [a, b] = shiftSpan(e);
    L.push('BEGIN:VEVENT', `UID:${e.uid}@behind-the-bar`, `DTSTAMP:${now}`, `DTSTART;TZID=America/New_York:${icsStamp(a)}`, `DTEND;TZID=America/New_York:${icsStamp(b)}`, `SUMMARY:${icsEsc(e.title)}`);
    if (e.desc) L.push(`DESCRIPTION:${icsEsc(e.desc)}`);
    L.push('BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(e.title)}`, 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function icsFileFor(p, A) {
  const evs = A.per[p.id].shifts.map(s => ({ uid: s.id, date: s.date, start: s.start, end: s.end, title: `${typeName(s)} shift · ${S.settings.barName}`, desc: `${s.role}${s.note ? '. ' + s.note : ''}` }));
  const name = `${firstName(p.name).toLowerCase()}-shifts-${A.ws}.ics`;
  return new File([buildICS(evs)], name, { type: 'text/calendar' });
}

/* ---------- picture of the week (canvas, light theme so it reads in any chat) ---------- */
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fitText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
async function drawSchedule(A) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* ignore */ }
  const main = S.settings.roles[0];
  const people = orderedStaff(S.staff).filter(p => A.per[p.id] && A.per[p.id].shifts.length);
  let stack = 1;
  people.forEach(p => A.days.forEach(d => { stack = Math.max(stack, A.per[p.id].shifts.filter(s => s.date === d).length); }));
  const W = 1500, P = 48, nameW = 250, colW = (W - P * 2 - nameW) / 7;
  const chipH = 54, rowH = stack * (chipH + 6) + 14;
  const headH = 150, dayH = 64, footH = 70;
  const H = headH + dayH + Math.max(1, people.length) * rowH + footH;
  const k = 2;
  const cv = document.createElement('canvas');
  cv.width = W * k; cv.height = H * k;
  const g = cv.getContext('2d');
  g.scale(k, k);
  const C = { bg: '#FFFFFF', ink: '#15181D', muted: '#5B636E', line: '#E3E6EA', soft: '#F3F5F7', band: '#FAFBFC', accent: '#0C6B66' };
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = C.accent; g.fillRect(0, 0, W, 8);
  g.fillStyle = C.ink; g.font = `800 60px ${FONT_DISPLAY}`; g.textBaseline = 'alphabetic';
  g.fillText(fitText(g, S.settings.barName.toUpperCase(), W - P * 2), P, 84);
  g.fillStyle = C.muted; g.font = `600 26px ${FONT_BODY}`;
  g.fillText(`Schedule for ${fmtWeekRange(A.ws, true)}`, P, 124);
  let y = headH;
  g.fillStyle = C.soft; rr(g, P, y, W - P * 2, dayH, 12); g.fill();
  const today = todayStr();
  A.days.forEach((d, i) => {
    const x = P + nameW + i * colW;
    g.fillStyle = C.muted; g.font = `700 17px ${FONT_UI}`; g.fillText(DOW[weekday(d)].toUpperCase(), x + 12, y + 26);
    g.fillStyle = d === today ? C.accent : C.ink; g.font = `800 28px ${FONT_DISPLAY}`; g.fillText(fmtMD(d), x + 12, y + 54);
  });
  g.fillStyle = C.muted; g.font = `700 17px ${FONT_UI}`; g.fillText('TEAM', P + 16, y + 40);
  y += dayH;
  people.forEach((p, ri) => {
    const top = y + ri * rowH;
    if (ri % 2 === 1) { g.fillStyle = C.band; g.fillRect(P, top, W - P * 2, rowH); }
    g.fillStyle = C.line; g.fillRect(P, top + rowH - 1, W - P * 2, 1);
    const cy = top + rowH / 2;
    g.fillStyle = p.color; g.beginPath(); g.arc(P + 30, cy, 18, 0, Math.PI * 2); g.fill();
    g.fillStyle = textOn(p.color); g.font = `700 15px ${FONT_UI}`; g.textAlign = 'center'; g.fillText(initials(p.name), P + 30, cy + 5); g.textAlign = 'left';
    g.fillStyle = C.ink; g.font = `600 21px ${FONT_BODY}`; g.fillText(fitText(g, p.name, nameW - 70), P + 58, cy - 2);
    g.fillStyle = C.muted; g.font = `500 16px ${FONT_UI}`; g.fillText(`${fmtH(A.per[p.id].paidMins / 60)}h · ${p.roles[0]}`, P + 58, cy + 20);
    A.days.forEach((d, i) => {
      const list = A.per[p.id].shifts.filter(s => s.date === d).sort((a, b) => shiftSpan(a)[0] - shiftSpan(b)[0]);
      list.forEach((s, j) => {
        const x = P + nameW + i * colW + 6, yy = top + 7 + j * (chipH + 6), w = colW - 12;
        const col = typeColor(s);
        g.fillStyle = mixHex(col, '#FFFFFF', 0.16); rr(g, x, yy, w, chipH, 10); g.fill();
        g.strokeStyle = mixHex(col, '#FFFFFF', 0.5); g.lineWidth = 1.2; g.stroke();
        g.fillStyle = col; g.beginPath(); g.arc(x + 14, yy + 19, 5, 0, Math.PI * 2); g.fill();
        g.fillStyle = C.ink; g.font = `700 18px ${FONT_UI}`;
        g.fillText(fitText(g, typeName(s), w - 32), x + 26, yy + 25);
        g.fillStyle = C.muted; g.font = `600 17px ${FONT_UI}`;
        g.fillText(fitText(g, fmtRange(s.start, s.end) + (s.role !== p.roles[0] ? ` · ${s.role}` : ''), w - 20), x + 12, yy + 46);
      });
    });
  });
  g.fillStyle = C.line;
  for (let i = 0; i <= 7; i++) g.fillRect(P + nameW + i * colW, headH + dayH, 1, people.length * rowH);
  const fy = y + people.length * rowH + 44;
  const meta = S.weeks[A.ws] || {};
  g.fillStyle = C.muted; g.font = `500 18px ${FONT_BODY}`;
  g.fillText(`${meta.sentAt ? 'Sent' : 'Updated'} ${fmtStamp(meta.sentAt || Date.now())}`, P, fy);
  return cv;
}

/* ---------- share sheet ---------- */
async function prepareShare() {
  const A = CUR_A;
  const k = U.sheet;
  if (!A.week.length) return;
  try {
    const cv = await drawSchedule(A);
    const url = cv.toDataURL('image/png');
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (U.sheet !== k) return;
    k.img = url;
    k.file = new File([blob], `schedule-${A.ws}.png`, { type: 'image/png' });
  } catch (e) { k.imgError = true; }
  if (!IN_FRAME) { try { k.link = await makeLink(A); } catch (e) { k.link = ''; } }
  if (U.sheet === k) renderSheet();
}
